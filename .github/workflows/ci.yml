name: CI quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Generate demo
        run: npm run demo

      - name: Verify demo outputs
        shell: bash
        run: |
          test -f output/demo/index.html
          test -f output/demo/migration-plan.json
          test -f output/demo/canonical-graph.json
          test -f output/demo/manifest.json

  build-pages:
    name: Build public demo
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate public demo
        run: npm run public-demo

      - name: Audit public demo privacy
        run: npm run check:public-demo

      - name: Verify public artifact contract
        shell: bash
        run: |
          test -f output/demo/index.html
          test -f output/demo/migration-plan.json
          test -f output/demo/canonical-graph.json
          test -f output/demo/manifest.json
          test "$(jq -r .sourceDescription output/demo/canonical-graph.json)" = "synthetic-fixture:fixtures/notion-export"
          test "$(jq -r .outputDirectory output/demo/manifest.json)" = "."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/demo

  deploy:
    name: Deploy public demo
    needs:
      - validate
      - build-pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
